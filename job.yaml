apiVersion: batch/v1
kind: Job
metadata:
  name: gddpm
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1209600    # 14 days — multi-seed (4×) + repeated CV (15 fits/model) needs headroom
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-RTX-A6000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-2080-Ti
      containers:
      - name: gddpm
        image: nvcr.io/nvidia/pytorch:23.10-py3
        imagePullPolicy: IfNotPresent

        env:
        - name: REPO_PATH
          value: /opt/repo/gdppm

        command:
        - "bash"
        - "-c"
        - |
          set -e
          echo "=== Checking GPU ==="
          nvidia-smi

          echo "=== Cloning / updating repo ==="
          mkdir -p /opt/repo && cd /opt/repo
          if [ -d "gdppm" ]; then
            cd gdppm && git pull origin main
          else
            git clone --single-branch -b main \
              https://github.com/Deb-bie/gdppm.git \
              gdppm
            cd gdppm
          fi

          echo "=== Removing conflicting base-image packages ==="
          # opencv: remove ALL variants (base image bakes one in; we pin 4.8.1.78)
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python \
            opencv-contrib-python-headless 2>/dev/null || true
 
          # Packages whose base-image versions conflict with our pinned versions:
          #   timm     — base has older version; HybridV2 needs features_only (>=0.9)
          #   optuna   — base may have older TPESampler API
          #   diffusers / transformers / huggingface_hub — we pin exact versions
          pip uninstall -y shap diffusers transformers huggingface_hub timm optuna 2>/dev/null || true
 
          # RAPIDS / NVIDIA utility packages we do NOT use.
          # These conflict with pandas 2.x and cause noisy (non-fatal) pip warnings.
          pip uninstall -y cudf dask-cuda dask-cudf torch-tensorrt \
            torchdata torchtext 2>/dev/null || true
 
          echo "=== Pinning opencv before requirements ==="
          # Install opencv first so everything that imports cv2 gets the right binary.
          pip install -q opencv-python-headless==4.8.1.78
 
          echo "=== Freezing torch to base-image version ==="
          # Record the torch version already compiled against the node's CUDA libs.
          # We pass --constraint so pip never silently upgrades torch while resolving
          # our other requirements (an upgrade breaks torchvision ABI compatibility).
          TORCH_VER=$(python -c "import torch; print(torch.__version__)" 2>/dev/null || echo "")
          if [ -n "$TORCH_VER" ]; then
            echo "torch==${TORCH_VER}" > /tmp/torch_constraint.txt
            echo "torchvision" >> /tmp/torch_constraint.txt   # let torchvision float
            PIP_CONSTRAINT=/tmp/torch_constraint.txt pip install -q -r requirements.txt
          else
            pip install -q -r requirements.txt
          fi
 
          echo "=== Installing lpips (Gap 27 diversity metrics) ==="
          # Installed separately as a safety net — also present in requirements.txt.
          pip install -q lpips
 
          echo "=== Patching VAE / text-encoder device mismatch ==="
          # When CPU offload is active (11 GB VRAM nodes), vae and text_encoder sit on
          # CPU but pv/ii are on CUDA, causing:
          #   RuntimeError: Input type (torch.cuda.FloatTensor) and
          #                  weight type (torch.FloatTensor) should be the same
          # Fix: resolve the device at runtime by moving the input to wherever the
          # model lives, then moving the output back to DEVICE for the training step.
          python3 - << 'PATCH'
          import sys
           
          with open("gastrovision_pipeline.py") as f:
              txt = f.read()
           
          changes = 0
           
          # ── Fix 1: VAE encode ────────────────────────────────────────────────────────
          old1 = "            lat = vae.encode(pv).latent_dist.sample() * vae.config.scaling_factor"
          new1 = (
              "            _vae_dev = next(vae.parameters()).device\n"
              "            lat = vae.encode(pv.to(_vae_dev)).latent_dist.sample() * vae.config.scaling_factor\n"
              "            lat = lat.to(DEVICE)"
          )
          if old1 in txt:
              txt = txt.replace(old1, new1, 1)
              changes += 1
              print("  ✓ VAE encode patch applied")
          else:
              print("  ⚠ VAE encode line not found — skipping (may already be patched)")
           
          # ── Fix 2: text encoder forward ──────────────────────────────────────────────
          old2 = "            hs = text_encoder(ii)[0]"
          new2 = (
              "            _te_dev = next(text_encoder.parameters()).device\n"
              "            hs = text_encoder(ii.to(_te_dev))[0]\n"
              "            hs = hs.to(DEVICE)"
          )
          if old2 in txt:
              txt = txt.replace(old2, new2, 1)
              changes += 1
              print("  ✓ text_encoder forward patch applied")
          else:
              print("  ⚠ text_encoder line not found — skipping (may already be patched)")
           
          with open("gastrovision_pipeline.py", "w") as f:
              f.write(txt)
           
          print(f"  Patch complete ({changes}/2 fixes applied)")
          PATCH
 
          echo "=== Starting pipeline ==="
          python gastrovision_pipeline.py \
            --data_dir            /data/gastrovision/data         \
            --output_dir          /data/gastrovision               \
            --image_root          gastrovision_raw/Gastrovision    \
            --batch_size          16                               \
            --freeze_epochs       16                               \
            --fine_tune_epochs    24                               \
            --lora_rank           4                                \
            --lora_alpha          8                                \
            --sd_batch_size       1                                \
            --sd_grad_accum       16                               \
            --domain_adapt_steps  15000                            \
            --samples_per_class   500                              \
            --gen_steps           40                               \
            --guidance_scale      7.0                              \
            --gen_batch_size      1                                \
            --seeds               42 123 456 789                   \
            --loss_type           focal                            \
            --gan_collapse_threshold 0.02                          \
            --gan_collapse_patience  10                            \
            --lora_rank_list      4 8 16 32                        \
            --models efficientnetv2_rw_s swin mobile hybrid_cnn_transformer_v2
            # ── Optional flags (uncomment to enable) ─────────────────────────
            # --tune                   # Optuna hyperparameter search before training
            # --tune_trials 15         # number of Optuna trials per model (default 15)
            # --tune_epochs 8          # epochs per trial (default 8)
            # --run_gan_baseline       # train DCGAN + build S5 (real+GAN) strategy
            # --single_split           # bypass repeated CV; use a single train/val split
            # --cost_matrix_path /data/gastrovision/cost_matrix.json
            # --skip_domain_adapt      # skip if EMA adapter already on PVC
            # --skip_generation        # skip if synthetic images already on PVC
            # --skip_training          # skip all classifier training
            # --evaluate_only          # only run evaluation on existing checkpoints
 

        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: git-volume
          mountPath: /opt/repo
        - name: gdppm-data-volume
          mountPath: /data

        resources:
          limits:
            memory: 64Gi  
            cpu: "8"
            nvidia.com/gpu: "1"
            ephemeral-storage: 80Gi 
          requests:
            memory: 24Gi 
            cpu: "4"
            nvidia.com/gpu: "1"
            ephemeral-storage: 40Gi 

      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: git-volume
        emptyDir: {}
      - name: gdppm-data-volume
        persistentVolumeClaim:
          claimName: gdppm-data-pvc
